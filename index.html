<div class="page"><div class="head"><h2 class="h">Shop now: build your basket</h2><div class="budget">Budget $20</div></div><div class="main"><div class="shop"><div class="row"><div><b>Apples</b><div class="small">$3 per bag · countable</div></div><div class="controls"><button class="btn" data-item="apples" data-delta="-1">−</button><span class="qty" id="q-apples">0</span><button class="btn" data-item="apples" data-delta="1">+</button></div></div><div class="row"><div><b>Milk</b><div class="small">$4 per bottle · amount</div></div><div class="controls"><button class="btn" data-item="milk" data-delta="-1">−</button><span class="qty" id="q-milk">0</span><button class="btn" data-item="milk" data-delta="1">+</button></div></div><div class="row"><div><b>Bread</b><div class="small">$3 per loaf · amount</div></div><div class="controls"><button class="btn" data-item="bread" data-delta="-1">−</button><span class="qty" id="q-bread">0</span><button class="btn" data-item="bread" data-delta="1">+</button></div></div><div class="row"><div><b>Eggs</b><div class="small">$5 per box · countable</div></div><div class="controls"><button class="btn" data-item="eggs" data-delta="-1">−</button><span class="qty" id="q-eggs">0</span><button class="btn" data-item="eggs" data-delta="1">+</button></div></div></div><div class="receipt"><h3>Your receipt</h3><div class="line"><span>Apples</span><span id="s-apples">$0</span></div><div class="line"><span>Milk</span><span id="s-milk">$0</span></div><div class="line"><span>Bread</span><span id="s-bread">$0</span></div><div class="line"><span>Eggs</span><span id="s-eggs">$0</span></div><div class="total">Total: <span id="total">$0</span></div><div class="left">Left: <span id="left">$20</span></div><div class="msg" id="msg">Choose food for one week.</div></div></div><div class="prompt"><b>Say it:</b> “We bought ___ apples and ___ milk. We have $___ left.”</div></div>
<script>
(function(){var prices={apples:3,milk:4,bread:3,eggs:5};var state={apples:0,milk:0,bread:0,eggs:0};function render(){var total=0;Object.keys(prices).forEach(function(k){var cost=state[k]*prices[k];total+=cost;document.getElementById('q-'+k).textContent=state[k];document.getElementById('s-'+k).textContent='$'+cost});document.getElementById('total').textContent='$'+total;document.getElementById('left').textContent='$'+(20-total);document.getElementById('msg').textContent=total===20?'Exactly $0 left — perfect budget!':total>20?'Too expensive — remove one item.':'You can still buy $'+(20-total)+' more.';window.parent.postMessage({type:'saveState',state:state},'*')}document.querySelectorAll('.btn').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.item,d=Number(b.dataset.delta),next=state[k]+d;if(next<0)return;if(next*prices[k]+Object.keys(prices).filter(function(x){return x!==k}).reduce(function(s,x){return s+state[x]*prices[x]},0)>20)return;state[k]=next;render()})});window.addEventListener('message',function(e){if(e.data&&e.data.type==='restoreState'&&e.data.state){state=e.data.state;render()}});render()})();
